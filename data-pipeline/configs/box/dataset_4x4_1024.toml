# musubi-tuner dataset config. Fill the two directories for the local dataset.
[general]
resolution = [1024, 1024]
caption_extension = ".txt"
batch_size = 1
enable_bucket = false

[[datasets]]
image_directory = "/path/to/krea-dataset/sheets_4x4_1024/train"
cache_directory = "/path/to/krea-dataset/cache/4x4_1024"
num_repeats = 1
